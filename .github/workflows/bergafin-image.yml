# Monta a imagem ghcr.io/agelinena/bergafin: Jellyfin oficial + este web.
# A versão do Jellyfin é a tag oficial (vX.Y) em que o main está baseado.
name: Bergafin - imagem

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

concurrency:
  group: bergafin-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Versão
        id: v
        run: |
          BASE=$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD)
          echo "jellyfin=${BASE#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "Base oficial: $BASE"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: bergafin/Dockerfile
          platforms: linux/amd64
          build-args: JELLYFIN_VERSION=${{ steps.v.outputs.jellyfin }}
          push: true
          # Só a tag exata; latest e X.Y saem depois da conferência
          tags: ghcr.io/agelinena/bergafin:${{ steps.v.outputs.jellyfin }}-${{ steps.v.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conferir a imagem
        run: |
          IMG=ghcr.io/agelinena/bergafin:${{ steps.v.outputs.jellyfin }}-${{ steps.v.outputs.sha }}
          docker run -d --name jf -p 8096:8096 "$IMG"
          # Container novo, sem mídia: o /health fica "Degraded"; a API pública basta
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8096/System/Info/Public >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8096/System/Info/Public || { docker logs jf | tail -50; exit 1; }
          echo
          # O web servido tem que ser o nosso
          curl -fsS http://localhost:8096/web/ | grep -q '<html'
          docker exec jf grep -rlq "bergafinTicket" /jellyfin/jellyfin-web \
            || { echo "O web da imagem não é o Bergafin-web"; exit 1; }
          docker rm -f jf

      - name: Publicar latest e ${{ steps.v.outputs.jellyfin }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/agelinena/bergafin:latest \
            -t ghcr.io/agelinena/bergafin:${{ steps.v.outputs.jellyfin }} \
            ghcr.io/agelinena/bergafin:${{ steps.v.outputs.jellyfin }}-${{ steps.v.outputs.sha }}
